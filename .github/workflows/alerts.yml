name: Internship alerts

on:
  schedule:
    # Every 5 minutes (GitHub's minimum), at :02, :07, :12... to stay off the top of
    # the hour, when GitHub is busiest and scheduled runs start latest.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # to commit seen.txt

concurrency:
  group: internship-alerts

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Runs first so check.py can skip roles this step already alerted on.
      - name: Check company careers pages
        run: python3 watch_direct.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy-me.com

      - name: Check Simplify list for new roles
        if: always()
        run: python3 check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy-me.com
          GITHUB_TOKEN: ${{ github.token }}

      # These commits also keep the repo active, so GitHub doesn't pause the schedule after 60 days.
      - name: Save roles already alerted on
        if: always()
        run: |
          git add seen.txt seen_direct.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record new roles"
          git push
